<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carry Studio | Creator Workflow</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      color: #58a6ff;
      background: rgba(56, 139, 253, 0.15);
      border: 1px solid rgba(56, 139, 253, 0.3);
      border-radius: 20px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 42px;
      margin: 0 0 16px;
      background: linear-gradient(135deg, #ffffff 0%, #8b949e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #8b949e;
      font-size: 18px;
      max-width: 600px;
      line-height: 1.6;
      margin: 0 0 32px;
    }
    .links a {
      color: #58a6ff;
      text-decoration: none;
      margin: 0 16px;
      font-size: 15px;
      font-weight: 500;
    }
    .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="badge">Internal Creator Workflow</div>
  <h1>Carry Studio</h1>
  <p>Automated market research, visual design, and photo carousel publishing for TikTok content creators (@carry.vietnam.tw).</p>
  <div class="links">
    <a href="/terms/">Terms of Service</a>
    <a href="/privacy/">Privacy Policy</a>
  </div>
</body>
</html>
